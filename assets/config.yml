---
# 首页：GitHub 仓库与对应网址
# 配置文档：https://github.com/bastienwirtz/homer/blob/main/docs/configuration.md
# 图标搜索：https://fontawesome.com/search
#
# 每个仓库是一组（group），组里每张卡片是一个链接。
# 给仓库加网址：复制一段「- name / icon / subtitle / url」改一下即可。
# ⚠️ 不要在这里写任何密码，这个文件会随网页一起公开。

title: "账号管理中心"
subtitle: "langhua98 的仓库与链接"
logo: "logo.png"

header: true
footer: false

theme: default
defaults:
  layout: columns
  colorTheme: auto

message:
  style: "is-info"
  title: "使用说明"
  icon: "fa-solid fa-circle-info"
  content: "按仓库分组管理所有网址。新增或修改链接请编辑仓库里的 <code>assets/config.yml</code>；账号入口在导航栏「账号」页面。密码请存放在 Bitwarden 等密码管理器中，不要写进本页面。"

links:
