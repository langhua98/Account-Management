<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账号管理中心</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 解锁 / 初始化 -->
<section id="lock-screen" class="lock">
  <div class="lock-card">
    <h1>🔐 账号管理中心</h1>
    <p id="lock-hint" class="muted"></p>
    <form id="lock-form">
      <input id="master-pw" type="password" placeholder="主密码" autocomplete="current-password" required>
      <input id="master-pw2" type="password" placeholder="再次输入主密码" autocomplete="new-password" hidden>
      <button class="primary" type="submit" id="lock-btn">解锁</button>
      <p id="lock-error" class="error"></p>
    </form>
    <details class="muted small">
      <summary>数据存在哪里？</summary>
      所有数据用主密码通过 AES-GCM 加密后，只保存在当前浏览器的 localStorage 中，不会上传到任何服务器。
      换电脑或清理浏览器前请在「设置」里导出备份。主密码忘记后数据无法恢复。
    </details>
  </div>
</section>

<!-- 主界面 -->
<div id="app" hidden>
  <header class="topbar">
    <div class="brand">🔐 账号管理中心</div>
    <nav class="tabs">
      <button data-tab="accounts" class="tab active">账号</button>
      <button data-tab="repos" class="tab">GitHub 仓库</button>
      <button data-tab="links" class="tab">全部链接</button>
      <button data-tab="settings" class="tab">设置</button>
    </nav>
    <div class="top-actions">
      <input id="search" type="search" placeholder="搜索名称 / 用户名 / 链接 / 标签…">
      <button id="lock-now" title="立即锁定">锁定</button>
    </div>
  </header>

  <main>
    <!-- 账号 -->
    <section id="tab-accounts" class="panel">
      <div class="panel-head">
        <div>
          <h2>账号</h2>
          <div id="account-tags" class="tag-filter"></div>
        </div>
        <button class="primary" id="add-account">+ 新增账号</button>
      </div>
      <div id="account-list" class="grid"></div>
    </section>

    <!-- 仓库 -->
    <section id="tab-repos" class="panel" hidden>
      <div class="panel-head">
        <div>
          <h2>GitHub 仓库</h2>
          <p class="muted small">在「设置」里填写 GitHub 用户名后点击同步，会自动导入你所有的仓库。每个仓库可以添加任意多个相关链接（线上地址、后台、文档、部署平台…）。</p>
        </div>
        <div class="btn-row">
          <button id="sync-github">⟳ 从 GitHub 同步</button>
          <button class="primary" id="add-repo">+ 手动添加仓库</button>
        </div>
      </div>
      <div id="repo-list" class="grid"></div>
    </section>

    <!-- 链接汇总 -->
    <section id="tab-links" class="panel" hidden>
      <div class="panel-head"><h2>全部链接</h2></div>
      <table class="table">
        <thead><tr><th>来源</th><th>名称</th><th>网址</th><th>关联账号</th></tr></thead>
        <tbody id="link-table"></tbody>
      </table>
    </section>

    <!-- 设置 -->
    <section id="tab-settings" class="panel" hidden>
      <h2>设置</h2>
      <form id="settings-form" class="form card">
        <label>GitHub 用户名<input name="githubUser" placeholder="例如 langhua98"></label>
        <label>GitHub Token（可选，用于同步私有仓库，只需 repo 只读权限）
          <input name="githubToken" type="password" placeholder="ghp_…" autocomplete="off">
        </label>
        <label>自动锁定（分钟，0 表示不自动锁定）<input name="autoLock" type="number" min="0" value="10"></label>
        <button class="primary" type="submit">保存设置</button>
      </form>

      <div class="card">
        <h3>备份与恢复</h3>
        <p class="muted small">导出的备份文件仍是加密的（需要主密码才能打开），可以放心存到网盘。</p>
        <div class="btn-row">
          <button id="export-enc">导出加密备份</button>
          <button id="export-plain">导出明文 JSON</button>
          <label class="button">导入备份<input id="import-file" type="file" accept=".json" hidden></label>
        </div>
      </div>

      <div class="card">
        <h3>安全</h3>
        <div class="btn-row">
          <button id="change-pw">修改主密码</button>
          <button id="wipe" class="danger">清空全部数据</button>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- 通用弹窗 -->
<dialog id="modal">
  <form id="modal-form" method="dialog" class="form">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="btn-row end">
      <button type="button" id="modal-delete" class="danger" hidden>删除</button>
      <span class="spacer"></span>
      <button type="button" id="modal-cancel">取消</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
